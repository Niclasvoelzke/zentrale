<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zentrale</title>
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zentrale">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --text:#1b1b1a; --muted:#6e6d69; --faint:#a3a29d;
  --line:#e5e4e0; --accent:#245b84; --accent-soft:#e7eef4; --danger:#a33a2c; --warn:#9a6a14;
  --hi:#b5452f; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141414; --surface:#1d1d1c; --text:#ecebe7; --muted:#a09f9a; --faint:#6c6b67;
    --line:#2d2d2b; --accent:#7fb1d8; --accent-soft:#1f2a33; --danger:#e07a6b; --warn:#d6a54c; --hi:#e07a6b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(140px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}  /* verhindert das Hineinzoomen auf dem iPhone */
button{cursor:pointer;background:none;border:0;padding:0}
.hidden{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* Kopf */
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;height:50px}
.bar h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{color:var(--accent);font-size:30px;line-height:1;width:30px;height:40px;margin-left:-6px;font-weight:300}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:20px;height:20px}
/* Tab-Leiste unten (wie iOS) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--faint);font-size:10.5px;position:relative}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--text)}
.tabbar .b{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--hi);color:#fff;font-size:10.5px;line-height:17px;font-weight:600}

/* Listen */
main{padding-top:6px}
.section{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.section.over{color:var(--danger)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.task.p1::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--hi)}
.check{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);margin-top:1px;display:grid;place-items:center}
.check:hover{border-color:var(--accent)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .t{color:var(--faint);text-decoration:line-through}
.tbody{flex:1;min-width:0;cursor:pointer}
.t{word-wrap:break-word}
.m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:0 10px}
.m .due.over{color:var(--danger)} .m .due.today{color:var(--accent)}
.m .st{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:13px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .name{flex:1}
.row .cnt{color:var(--muted);font-size:13px}
.row .chev{color:var(--faint)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}
.link-btn{color:var(--accent);font-size:14px;padding:10px 2px}
.toolbar{display:flex;gap:16px;justify-content:flex-end}

/* Erfassen */
.capture{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:8px 0}
.cap-row{display:flex;gap:8px;align-items:flex-end}
.cap-row textarea{flex:1;min-width:0;resize:none;min-height:44px;max-height:140px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none;line-height:1.35}
.cap-row textarea:focus{border-color:var(--accent)}
.round{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.round svg{width:20px;height:20px}
.round.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.round.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.round:disabled{opacity:.4}
.reply{margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;max-height:45vh;overflow:auto}
.reply .acts{color:var(--muted);font-size:12.5px;margin-top:6px}
.reply .x{float:right;color:var(--faint);margin-left:8px}
.draft{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px}
.draft .lbl{font-size:12px;color:var(--muted)}
.draft input,.draft textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);margin:3px 0 7px}
.draft textarea{min-height:140px;resize:vertical}
.draft .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.danger{color:var(--danger)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}

/* Blatt (Bearbeiten) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:14px}}
.sheet h2{font-size:16px;margin:0 0 12px}
.sheet-head{position:sticky;top:-16px;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-16px -16px 10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:16px}
.sheet-head button{color:var(--accent);font-size:16px;padding:4px 0}
.sheet-head button.strong{font-weight:600}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);outline:none}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid2 > *{min-width:0}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.sheet .btns{display:flex;gap:8px;justify-content:space-between;margin-top:14px}

/* Agenten */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap;color:var(--muted)}
.chips button.on{border-color:var(--text);color:var(--text);font-weight:600}
.agent-intro{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.quick button{padding:7px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13.5px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14.5px;line-height:1.45;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--text);color:var(--bg);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .acts{color:var(--muted);font-size:12px;margin-top:6px;border-top:1px solid var(--line);padding-top:5px}
.msg .say{float:right;margin-left:8px;color:var(--faint);font-size:12px}
.msg time{display:block;font-size:11px;color:var(--faint);margin-top:4px}
.agent-tools{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.agent-tools .on{color:var(--text);font-weight:600}
details.depot{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:4px 0 10px}
details.depot summary{padding:10px 12px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;list-style:none}
details.depot summary::-webkit-details-marker{display:none}
details.depot .pos{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px}
details.depot .pos small{color:var(--muted);display:block}
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.log .e{padding:10px 12px;border-top:1px solid var(--line)}
.log .e:first-child{border-top:0}
.log .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.log .h b{font-weight:600}
.log .h span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.log .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.log .k.mangel{color:var(--danger)} .log .k.nachtrag{color:var(--accent)}
.log .c{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.log .c.cut{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.agents .row{padding:12px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px}
.agents .who{flex:1;min-width:0}
.agents .who b{display:block;font-weight:600}
.agents .who small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.pill{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.pill.on{border-color:var(--text);color:var(--text);font-weight:600}
.today-cta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--radius);font-size:14px;color:var(--muted)}

.round.listen{background:var(--accent);border-color:var(--accent);color:#fff}

.round.vstart{background:var(--accent);border-color:var(--accent);color:#fff}
.vbtn{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-left:2px}
.vbtn svg{width:18px;height:18px}

/* Sprechmodus (Vollbild) */
.vmode{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px)}
.vmode .who{font-size:18px;font-weight:600;text-align:center}
.vmode .role{color:var(--muted);font-size:14px;text-align:center;margin-top:2px}
.vmode .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;width:100%;min-height:0}
.orb{width:170px;height:170px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#5f8fb8,var(--accent) 60%,#173c58);
  box-shadow:0 10px 40px rgba(36,91,132,.35);transition:transform .25s}
.orb.listening{animation:breathe 1.6s ease-in-out infinite}
.orb.thinking{animation:think 1.1s ease-in-out infinite;filter:saturate(.6)}
.orb.speaking{animation:talk .45s ease-in-out infinite alternate}
.orb.paused{filter:grayscale(.8);opacity:.6}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes think{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1);opacity:1}}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.12)}}
.vmode .state{font-size:15px;color:var(--muted);text-align:center;min-height:20px}
.vmode .sub{font-size:17px;line-height:1.45;text-align:center;max-height:32vh;overflow:auto;width:100%;max-width:520px;color:var(--text)}
.vmode .sub.me{color:var(--muted)}
.vmode .ctrl{display:flex;gap:28px;align-items:center}
.vmode .ctrl button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.vmode .ctrl button svg{width:24px;height:24px}
.vmode .ctrl .end{background:var(--danger);border-color:var(--danger);color:#fff}
.vmode .ctrl small{display:block;text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px}

/* Login */
.center{min-height:80vh;display:grid;place-items:center}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h1{font-size:20px;margin:0 0 4px}
.card p{color:var(--muted);font-size:14px;margin:0 0 16px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:14px;z-index:60}
</style>
</head>
<body>

<!-- Einrichtung (nur falls config.js leer ist) -->
<div id="setup" class="wrap center hidden">
  <div class="card">
    <h1>Zentrale einrichten</h1>
    <p>Supabase-Zugangsdaten eintragen (Supabase → Project Settings → API).</p>
    <div class="f"><label>Project URL</label><input id="su-url" placeholder="https://xxxx.supabase.co"></div>
    <div class="f"><label>anon public key</label><input id="su-key" placeholder="eyJ..."></div>
    <button class="btn primary" id="su-save" style="width:100%">Speichern</button>
  </div>
</div>

<!-- Anmeldung -->
<div id="login" class="wrap center hidden">
  <div class="card">
    <h1>Zentrale</h1>
    <p>Anmelden</p>
    <form id="login-form">
      <div class="f"><label>E-Mail</label><input id="li-mail" type="email" autocomplete="username" required></div>
      <div class="f"><label>Passwort</label><input id="li-pw" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%">Anmelden</button>
      <div class="err" id="li-err"></div>
    </form>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="bar">
        <button class="back hidden" id="back" aria-label="Zurück">‹</button>
        <h1 id="title">Heute</h1>
        <button class="icon-btn" id="add" title="Aufgabe anlegen" aria-label="Aufgabe anlegen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="menu" title="Einstellungen" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap" id="main"></main>

  <div class="capture">
    <div class="wrap">
      <div id="reply" class="reply hidden"></div>
      <div class="cap-row">
        <textarea id="cap" rows="1" placeholder="Zuruf an die Zentrale …" enterkeyhint="send"></textarea>
        <button class="round hidden" id="mic" title="Diktieren" aria-label="Diktieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="round vstart hidden" id="vstart" title="Sprechen" aria-label="Sprechmodus starten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></button>
        <button class="round primary" id="send" title="Senden" aria-label="Senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheet-root"></div>

<script src="config.js"></script>
<script src="wake-video.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
// ============================================================
// Grundlagen
// ============================================================
const VERSION = "13";
const STATUS = {
  offen: "Offen", in_arbeit: "In Arbeit", ich_warte: "Ich warte", wartet_auf_mich: "Wartet auf mich", erledigt: "Erledigt"
};
const PRIO = { 1: "Hoch", 2: "Normal", 3: "Niedrig" };
const DEFAULT_AREAS = ["SHK-Betrieb", "Finanzen (Gruppe)", "Immobilien", "Contracting", "VölzControl", "Privates"];
const AGENTS = {
  assistenz: { name: "Clara", label: "Assistenz", short: "Tag planen, erinnern, Prioritäten", title: "Persönliche Assistenz", intro: "Tag besprechen, erinnern, Prioritäten setzen. Was du erzählst, wird direkt als Aufgabe festgehalten.",
    quick: [["Morgenbriefing", "Morgenbriefing bitte: Was ist heute wichtig, in welcher Reihenfolge gehe ich es an?"], ["Tagesabschluss", "Tagesabschluss: Was ist erledigt, was bleibt offen, was schiebe ich auf morgen?"], ["Was vergesse ich?", "Woran denke ich gerade nicht, was aber wichtig ist? Wer wartet auf mich?"]] },
  zukunft: { name: "Zukunfts-Ich", label: "Journal", title: "Journal", intro: "Dein Journal – im Gespräch mit dir selbst, zehn Jahre weiter. Erzähl, was war und was dich beschäftigt.",
    quick: [["Tagesjournal", "Tagesjournal: Lass uns auf den heutigen Tag schauen."], ["Wochenrückblick", "Wochenrückblick: Was siehst du in meinen Einträgen dieser Woche?"], ["Entscheidung", "Ich stehe vor einer Entscheidung:"]] },
  investor: { name: "Viktor", label: "Investor", short: "Privates Vermögen und Investments", title: "Investor", intro: "Private Investments und Vermögen. Nenn Positionen und Werte, er pflegt die Übersicht und zeigt dir die nächsten Schritte.",
    quick: [["Überblick und nächste Schritte", "Gib mir einen Überblick über meine Investments und die nächsten sinnvollen Schritte."], ["Neue Position", "Ich möchte eine neue Position eintragen:"], ["Strategie klären", "Lass uns meine Anlagestrategie klären: Frag mich, was du dafür wissen musst."]] },
  cfo: { name: "Richard", label: "CFO", short: "Finanzen der Unternehmensgruppe", title: "CFO", intro: "Strategische Finanzbegleitung aller Unternehmen der Gruppe: Liquidität, Ertrag, Finanzierung, Struktur.",

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// Datum
const iso = (d) => d.toLocaleDateString("sv-SE");
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
function fmtDue(s) {
  if (!s) return "";
  const t = today();
  if (s === t) return "heute";
  if (s === addDays(t, 1)) return "morgen";
  if (s === addDays(t, -1)) return "gestern";
  const d = new Date(s + "T12:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}
function dayHeading(s) {
  const t = today();
  if (s === t) return "Heute";
  if (s === addDays(t, 1)) return "Morgen";
  return new Date(s + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
}

const CFG = window.ZENTRALE_CONFIG || {};
const SB_URL = CFG.supabaseUrl || ls.get("sb_url", "");
const SB_KEY = CFG.supabaseAnonKey || ls.get("sb_key", "");

function show(id) { ["setup", "login", "app"].forEach((x) => $("#" + x).classList.toggle("hidden", x !== id)); }

async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (!SB_URL || !SB_KEY) {
    show("setup");
    $("#su-save").onclick = () => {
      ls.set("sb_url", $("#su-url").value.trim()); ls.set("sb_key", $("#su-key").value.trim()); location.reload();
    };
    return;
  }
  sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  if (!data.session) return showLogin();
  start();
}

function showLogin() {
  show("login");
  $("#login-form").onsubmit = async (e) => {
    e.preventDefault(); $("#li-err").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("#li-mail").value.trim(), password: $("#li-pw").value });
    if (error) $("#li-err").textContent = "Anmeldung fehlgeschlagen: " + error.message; else start();

}

async function loadAll() {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const [a, p, t] = await Promise.all([
    sb.from("areas").select("*").order("sort").order("created_at"),
    sb.from("projects").select("*").order("sort").order("created_at"),
    sb.from("tasks").select("*").or(`status.neq.erledigt,done_at.gte.${since}`).order("created_at", { ascending: false }),
  ]);
  if (a.error || p.error || t.error) { toast("Laden fehlgeschlagen"); return; }
  S.areas = a.data; S.projects = p.data; S.tasks = t.data;
  // Bautagebuch (optional – fehlt die Tabelle noch, bleibt es einfach leer)
  const lg = await sb.from("site_log").select("*").order("entry_date", { ascending: false }).order("created_at", { ascending: false }).limit(500);
  S.log = lg.error ? [] : lg.data;
}

async function seedIfEmpty() {
  if (S.areas.length) return;
  const { data: { user } } = await sb.auth.getUser();
  await sb.from("areas").insert(DEFAULT_AREAS.map((name, i) => ({ name, sort: i, user_id: user.id })));
  await loadAll();
}

let reloadTimer = null;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => { await loadAll(); render(); }, 250);
}

async function start() {
  show("app");
  await loadAll();
  await seedIfEmpty();
  await loadSettings();
  if (S.view === "agenten") await (S.agentOpen ? loadAgent(S.agent) : loadOverview());
  render();
  sb.channel("sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "areas" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "site_log" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => { if (S.view === "agenten" && !busy) (S.agentOpen ? loadAgent(S.agent) : loadOverview()).then(render); })
    .on("postgres_changes", { event: "*", schema: "public", table: "settings" }, () => loadSettings().then(render))
    .on("postgres_changes", { event: "*", schema: "public", table: "investments" }, () => { if (S.view === "agenten") loadAgent(S.agent).then(render); })
    .subscribe();
  // Beim Zurückkehren in die App frisch laden (iOS pausiert Hintergrund-Verbindungen)
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleReload(); });
  setupCapture();
}

const areaOf = (id) => S.areas.find((a) => a.id === id);
const projOf = (id) => S.projects.find((p) => p.id === id);
const open = () => S.tasks.filter((t) => t.status !== "erledigt");
function sortTasks(list) {
  return list.slice().sort((a, b) =>
    (a.due_date || "9999").localeCompare(b.due_date || "9999") || a.priority - b.priority || b.created_at.localeCompare(a.created_at));
}

async function saveTask(id, patch) {
  const t = S.tasks.find((x) => x.id === id);
  if (t) { Object.assign(t, patch); render(); }
  const { error } = await sb.from("tasks").update(patch).eq("id", id);
  if (error) { toast("Speichern fehlgeschlagen"); scheduleReload(); }
}
async function insertTask(row) {
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from("tasks").insert({ ...row, user_id: user.id }).select().single();
  if (error) { toast("Anlegen fehlgeschlagen: " + error.message); return null; }
  S.tasks.unshift(data); render(); return data;
}

  warten: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bereiche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',

};
const VIEWS = [["heute", "Heute"], ["woche", "Woche"], ["warten", "Warten"], ["bereiche", "Projekte"], ["agenten", "Agenten"]];
const TAB_OF = { eingang: "bereiche", erledigt: "bereiche" };

function counts() {
  const t = today(), o = open();
  return {
    heute: o.filter((x) => x.due_date && x.due_date <= t).length,
    woche: o.filter((x) => x.due_date && x.due_date > t && x.due_date <= addDays(t, 7)).length,
    eingang: o.filter((x) => !x.area_id && !x.project_id).length,
    warten: o.filter((x) => x.status === "wartet_auf_mich").length,
    bereiche: 0,
    agenten: 0,
  };
}

const inChat = () => S.view === "agenten" && S.agentOpen;
function goTab(v) {
  if (v === "agenten" && S.view === "agenten" && S.agentOpen) { S.agentOpen = false; ls.set("agentOpen", false); stopSpeaking(); }
  S.view = v; S.stack = []; S.showDone = false; ls.set("view", v);
  render(); window.scrollTo(0, 0);
  if (v === "agenten") (S.agentOpen ? loadAgent(S.agent) : loadOverview()).then(() => { render(); if (S.agentOpen) scrollChat(); });
}
function render() {
  if (!inChat() && !(typeof V !== "undefined" && V)) keepAwake(false);
  const c = counts();
  const active = TAB_OF[S.view] || S.view;
  $("#tabbar").innerHTML = VIEWS.map(([k, l]) =>
    `<button data-view="${k}" class="${active === k ? "on" : ""}" aria-label="${l}">${ICON[k]}<span>${l}</span>${c[k] ? `<span class="b">${c[k]}</span>` : ""}</button>`).join("");
  $("#tabbar").querySelectorAll("button").forEach((b) => b.onclick = () => goTab(b.dataset.view));
  updateSendBtn();
  $("#cap").placeholder = inChat() ? (S.agent === "zukunft" ? "Journal-Eintrag …" : `Nachricht an ${agentName(S.agent)} …`) : "Zuruf an die Zentrale …";
  const back = (S.view === "bereiche" && S.stack.length) || S.view === "eingang" || S.view === "erledigt" || inChat();
  $("#back").classList.toggle("hidden", !back);
  $("#back").onclick = () => {
    stopSpeaking();
    if (inChat()) { S.agentOpen = false; ls.set("agentOpen", false); loadOverview().then(render); }
    else if (S.view === "eingang" || S.view === "erledigt") { S.view = S.returnTo || "heute"; }
    else { S.stack.pop(); S.showDone = false; }
    render(); window.scrollTo(0, 0);
  };
  const m = $("#main");
  ({ heute: viewToday, woche: viewWeek, eingang: viewInbox, warten: viewWaiting, bereiche: viewAreas, erledigt: viewDone, agenten: viewAgents }[S.view] || viewToday)(m);
  bindTaskRows(m);
}

function taskRow(t, opts = {}) {
  const t0 = today();
  const meta = [];
  if (!opts.hideWhere) {
    const a = areaOf(t.area_id), p = projOf(t.project_id);
    meta.push(esc(p ? `${a ? a.name + " › " : ""}${p.name}` : a ? a.name : "Eingang"));
  }
  if (t.due_date && t.status !== "erledigt") {
    const cls = t.due_date < t0 ? "over" : t.due_date === t0 ? "today" : "";
    meta.push(`<span class="due ${cls}">${esc(fmtDue(t.due_date))}</span>`);
  }
  if (t.status !== "offen" && t.status !== "erledigt") meta.push(`<span class="st">${STATUS[t.status]}${t.person ? ": " + esc(t.person) : ""}</span>`);
  else if (t.person) meta.push(esc(t.person));
  if (t.notes) meta.push("Notiz");
  return `<div class="task ${t.status === "erledigt" ? "done" : ""} ${t.priority === 1 ? "p1" : ""}" data-id="${t.id}">
    <button class="check" data-act="toggle" aria-label="Erledigt umschalten"></button>
    <div class="tbody" data-act="open"><div class="t">${esc(t.title)}</div>${meta.length ? `<div class="m">${meta.join("<span>·</span>")}</div>` : ""}</div>
  </div>`;
}
function list(tasks, opts) {
  return tasks.length ? `<div class="list">${tasks.map((t) => taskRow(t, opts)).join("")}</div>` : "";
}
function section(title, tasks, opts = {}, cls = "") {
  if (!tasks.length) return "";
  return `<div class="section ${cls}"><span>${esc(title)}</span><span>${tasks.length}</span></div>${list(tasks, opts)}`;
}
function bindTaskRows(root) {
  root.querySelectorAll(".task").forEach((el) => {
    const id = el.dataset.id;
    el.querySelector('[data-act="toggle"]').onclick = () => {
      const t = S.tasks.find((x) => x.id === id);
      saveTask(id, { status: t.status === "erledigt" ? "offen" : "erledigt", done_at: t.status === "erledigt" ? null : new Date().toISOString() });
    };
    el.querySelector('[data-act="open"]').onclick = () => openSheet(S.tasks.find((x) => x.id === id));
  });
}

function setTitle(s) { $("#title").textContent = s; }

function viewToday(m) {
  setTitle("Heute");
  const t = today(), o = sortTasks(open());
  const over = o.filter((x) => x.due_date && x.due_date < t);
  const now = o.filter((x) => x.due_date === t);
  const active = o.filter((x) => x.status === "in_arbeit" && (!x.due_date || x.due_date > t));
  const doneToday = S.tasks.filter((x) => x.status === "erledigt" && x.done_at && iso(new Date(x.done_at)) === t);
  let h = section("Überfällig", over, {}, "over") + section("Heute", now) + section("In Arbeit", active) + section("Heute erledigt", doneToday);
  if (!over.length && !now.length && !active.length) h = `<div class="empty">Für heute ist nichts fällig.</div>` + h;
  const nIn = counts().eingang;
  const top = (nIn ? `<div class="list" style="margin-top:12px"><div class="row" id="to-inbox"><span class="name">Eingang</span><span class="cnt">${nIn} unsortiert</span><span class="chev">›</span></div></div>` : "")
    + `<div class="today-cta"><span>Tag mit ${esc(agentName("assistenz"))} besprechen</span><button class="link-btn" id="to-brief" style="padding:0">Morgenbriefing</button></div>`;
  m.innerHTML = top + h;
  $("#to-brief").onclick = () => startAgent("assistenz", AGENTS.assistenz.quick[0][1]);
  const ti = $("#to-inbox"); if (ti) ti.onclick = () => { S.returnTo = "heute"; S.view = "eingang"; render(); window.scrollTo(0, 0); };
}

function viewWeek(m) {
  setTitle("Diese Woche");
  const t = today(), end = addDays(t, 7), o = sortTasks(open());
  const over = o.filter((x) => x.due_date && x.due_date < t);
  let h = section("Überfällig", over, {}, "over");
  for (let i = 0; i <= 7; i++) {
    const d = addDays(t, i);
    h += section(dayHeading(d), o.filter((x) => x.due_date === d));
  }
  const later = o.filter((x) => x.due_date && x.due_date > end);
  h += section("Später", later);
  m.innerHTML = h || `<div class="empty">Keine Termine in den nächsten Tagen.</div>`;
}

function viewInbox(m) {
  setTitle("Eingang");
  const inbox = sortTasks(open().filter((x) => !x.area_id && !x.project_id));
  m.innerHTML = inbox.length
    ? `<div class="section"><span>Noch nicht einsortiert</span><span>${inbox.length}</span></div>${list(inbox, { hideWhere: true })}
       <div class="toolbar"><button class="link-btn" id="sort-ai">Von der KI einsortieren lassen</button></div>`
    : `<div class="empty">Der Eingang ist leer.</div>`;
  const b = $("#sort-ai");
  if (b) b.onclick = () => askAgent("Sortiere alle Aufgaben im Eingang in passende Lebensbereiche und Projekte ein, wo die Zuordnung eindeutig ist. Unklare bleiben im Eingang.");
}

function viewWaiting(m) {
  setTitle("Warten");
  const o = sortTasks(open());
  const mine = o.filter((x) => x.status === "wartet_auf_mich");
  const theirs = o.filter((x) => x.status === "ich_warte");
  const h = section("Jemand wartet auf mich", mine) + section("Ich warte auf jemanden", theirs);
  m.innerHTML = h || `<div class="empty">Niemand wartet, und du wartest auf niemanden.</div>`;
}

function viewDone(m) {
  setTitle("Erledigt");
  const d = S.tasks.filter((x) => x.status === "erledigt").sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  m.innerHTML = section("Letzte 30 Tage", d) || `<div class="empty">Noch nichts erledigt.</div>`;
}

function viewAreas(m) {
  const top = S.stack[S.stack.length - 1];
  if (!top) {
    setTitle("Projekte");
    const o = open();
    const nIn = counts().eingang;
    m.innerHTML = `<div class="list" style="margin-top:12px"><div class="row" id="to-inbox"><span class="name">Eingang</span><span class="cnt">${nIn || ""}</span><span class="chev">›</span></div>
      <div class="row" id="to-done2"><span class="name">Erledigt</span><span class="cnt"></span><span class="chev">›</span></div></div>
      <div class="section"><span>Lebensbereiche</span></div><div class="list">${S.areas.map((a) => {
      const n = o.filter((t) => t.area_id === a.id).length;
      return `<div class="row" data-area="${a.id}"><span class="name">${esc(a.name)}</span><span class="cnt">${n || ""}</span><span class="chev">›</span></div>`;
    }).join("")}</div>
    <div class="toolbar"><button class="link-btn" id="new-area">Bereich anlegen</button><button class="link-btn hidden" id="to-done"></button></div>`;
    m.querySelectorAll("[data-area]").forEach((r) => r.onclick = () => { S.stack.push({ type: "area", id: r.dataset.area }); render(); window.scrollTo(0, 0); });
    $("#new-area").onclick = async () => {
      const name = prompt("Name des Lebensbereichs"); if (!name) return;
      const { data: { user } } = await sb.auth.getUser();
      await sb.from("areas").insert({ name: name.trim(), sort: S.areas.length, user_id: user.id }); scheduleReload();
    };
    $("#to-done").onclick = () => { S.returnTo = "bereiche"; S.view = "erledigt"; render(); };
    $("#to-done2").onclick = () => { S.returnTo = "bereiche"; S.view = "erledigt"; render(); window.scrollTo(0, 0); };
    $("#to-inbox").onclick = () => { S.returnTo = "bereiche"; S.view = "eingang"; render(); window.scrollTo(0, 0); };
    return;
  }
  if (top.type === "area") {
    const a = areaOf(top.id); if (!a) { S.stack = []; return render(); }
    setTitle(a.name);
    const o = open();
    const projs = S.projects.filter((p) => p.area_id === a.id && !p.archived);
    const loose = sortTasks(o.filter((t) => t.area_id === a.id && !t.project_id));
    let h = `<div class="section"><span>Projekte</span></div>`;
    h += projs.length ? `<div class="list">${projs.map((p) => {
      const n = o.filter((t) => t.project_id === p.id).length;
      return `<div class="row" data-proj="${p.id}"><span class="name">${esc(p.name)}</span><span class="cnt">${n || ""}</span><span class="chev">›</span></div>`;
    }).join("")}</div>` : `<div class="empty">Noch keine Projekte.</div>`;
    h += `<div class="toolbar"><button class="link-btn" id="new-proj">Projekt anlegen</button><button class="link-btn" id="ren-area">Umbenennen</button></div>`;
    h += section("Aufgaben ohne Projekt", loose, { hideWhere: true });
    m.innerHTML = h;
    m.querySelectorAll("[data-proj]").forEach((r) => r.onclick = () => { S.stack.push({ type: "project", id: r.dataset.proj }); render(); window.scrollTo(0, 0); });
    $("#new-proj").onclick = async () => {
      const name = prompt("Name des Projekts"); if (!name) return;
      const { data: { user } } = await sb.auth.getUser();
      await sb.from("projects").insert({ area_id: a.id, name: name.trim(), sort: projs.length, user_id: user.id }); scheduleReload();
    };
    $("#ren-area").onclick = async () => {
      const name = prompt("Neuer Name", a.name); if (!name) return;
      await sb.from("areas").update({ name: name.trim() }).eq("id", a.id); scheduleReload();
    };
    return;
  }
  // Projekt

// ============================================================
// Bildschirm wach halten, solange ein Agenten-Gespräch offen ist
// ============================================================
let wakeLockObj = null, awake = false, wakeVideo = null, wakeTimer = null;
// Zwei Sicherungen: (1) Wachhaltung von iOS, wird nach jeder Freigabe neu angefordert,
// (2) unsichtbares, stummes Endlos-Video – das hält iOS zuverlässig wach, auch wenn (1) entzogen wird.
function wakeRequest() {
  if (!awake || document.hidden || !("wakeLock" in navigator)) return;
  if (wakeLockObj && !wakeLockObj.released) return;
  navigator.wakeLock.request("screen").then((l) => {
    wakeLockObj = l;
    l.addEventListener("release", () => { wakeLockObj = null; if (awake && !document.hidden) setTimeout(wakeRequest, 400); });
  }).catch(() => {});
}
function wakeVideoPlay() {
  if (!awake || !window.WAKE_VIDEO) return;
  if (!wakeVideo) {
    const v = document.createElement("video");
    v.setAttribute("playsinline", ""); v.setAttribute("muted", ""); v.muted = true; v.loop = true; v.title = "";
    v.style.cssText = "position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;pointer-events:none;z-index:-1";
    [["webm", WAKE_VIDEO.webm], ["mp4", WAKE_VIDEO.mp4]].forEach(([t, src]) => { const so = document.createElement("source"); so.src = src; so.type = "video/" + t; v.appendChild(so); });
    // Sicherheitsnetz: kurz vor Ende zurückspulen, falls loop ignoriert wird
    v.addEventListener("timeupdate", () => { if (v.duration && v.currentTime > v.duration - 0.5) v.currentTime = 0; });
    document.body.appendChild(v);
    wakeVideo = v;
  }
  if (wakeVideo.paused) { const p = wakeVideo.play(); if (p && p.catch) p.catch(() => {}); }
}
function awakeKick() { if (awake) { wakeRequest(); wakeVideoPlay(); } }
function keepAwake(on) {
  if (on) {
    awake = true;
    awakeKick();
    if (!wakeTimer) wakeTimer = setInterval(awakeKick, 10000);   // regelmäßig prüfen und erneuern
  } else {
    if (!awake) return;
    awake = false;
    clearInterval(wakeTimer); wakeTimer = null;
    try { if (wakeLockObj) wakeLockObj.release(); } catch {}
    wakeLockObj = null;
    try { if (wakeVideo) wakeVideo.pause(); } catch {}
  }
}
// Falls die App direkt im Gespräch startet: beim ersten Antippen wach halten
document.addEventListener("click", () => { if (inChat() || (typeof V !== "undefined" && V)) keepAwake(true); }, true);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  // nach Rückkehr in die App: Wachhaltung erneuern, im Sprechmodus wieder zuhören
  awakeKick();
  if (typeof V !== "undefined" && V && !vrec && V.state !== "thinking" && V.state !== "speaking") { V.misses = 0; vListen(); }
});

async function fileToPayload(file) {
  if (file.type === "application/pdf") {
    if (file.size > 8 * 1024 * 1024) throw new Error("PDF ist größer als 8 MB");
    const b64 = await new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = fail; r.readAsDataURL(file); });
    return { data: b64, media_type: "application/pdf" };
  }
  // Fotos verkleinern (schneller, günstiger)
  const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = URL.createObjectURL(file); });
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", 0.85).split(",")[1], media_type: "image/jpeg" };
}

  };

function closeVoice() {
  V = null; vStopRec(); stopSpeaking();

}
function vSet(state, label, sub, me) {
  if (!V) return;
  V.state = state;
  const orb = $("#v-orb"); if (!orb) return;
  orb.className = "orb " + state;
  $("#v-state").textContent = label || "";

  if (sub !== undefined) { sb2.textContent = sub; sb2.classList.toggle("me", !!me); }

}
function vStopRec() { if (vrec) { const r = vrec; vrec = null; try { r.abort(); } catch {} } }
function vListen() {
  if (!V || vrec || V.state === "thinking") return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR(); r.lang = "de-DE"; r.interimResults = true; r.continuous = true;
  let heard = "", silence = null;
  r.onresult = (e) => {
    if (vrec !== r) return;
    let txt = "";
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    heard = txt.trim();
    vSet("listening", "Hört zu …", heard, true);
    clearTimeout(silence);
    silence = setTimeout(() => { try { r.stop(); } catch {} }, 1500);
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { vrec = null; vSet("paused", "Mikrofon nicht freigegeben – in den iPhone-Einstellungen für Safari erlauben."); }
  };
  r.onend = () => {
    clearTimeout(silence);
    if (vrec !== r) return;          // bewusst abgebrochen
    vrec = null;
    if (!V) return;
    if (heard) { V.misses = 0; vSend(heard); return; }
    V.misses++;
    if (V.misses >= 3) vSet("paused", "Tippe auf den Kreis, um zu sprechen.");
    else setTimeout(vListen, 250);
  };
  try { r.start(); vrec = r; vSet("listening", "Hört zu …", V.misses ? undefined : "", true); awakeKick(); }
  catch { vSet("paused", "Tippe auf den Kreis, um zu sprechen."); }
}
async function vSend(text) {
  if (!V) return;
  const agent = V.agent;
  vSet("thinking", "Denkt nach …", text, true);
  try {
    const { data, error } = await sb.functions.invoke("agent", { body: { agent, message: text, voice: true } });
    if (error || data?.error) throw new Error(data?.error || (await errText(error)));
    loadAgent(agent).then(() => { if (inChat()) { render(); scrollChat(); } });
    if (data.drafts?.length) showReply({ reply: "Mail-Entwurf zur Freigabe:", actions: [], drafts: data.drafts });
    scheduleReload();
    if (!V) return;
    const reply = data.reply || "Erledigt.";
    vSet("speaking", "Spricht – tippe, um zu unterbrechen", reply);
    speak(reply, true, () => { if (V && V.state === "speaking") { V.state = ""; setTimeout(vListen, 300); } }, agent);
  } catch (e) {
    vSet("paused", "Keine Antwort – tippe, um es nochmal zu versuchen.", String(e.message || e).slice(0, 120));
  }
}

// ---- Sprachausgabe (kostenlos, läuft auf dem Gerät) ----
let voice = null;
function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices().filter((v) => /^de(-|_|$)/i.test(v.lang));
  const rank = (v) => (/premium|enhanced|natural|neural/i.test(v.name) ? 0 : /google|anna|helena|petra|markus|yannick|katja/i.test(v.name) ? 1 : 2) + (v.localService ? 0 : 0.5);
  return vs.sort((x, y) => rank(x) - rank(y))[0] || null;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
// ---- Sprachausgabe: menschliche Stimme (ElevenLabs/OpenAI über Funktion "tts"), sonst Gerätestimme ----
let player = null, cloudTTS = null, speakToken = 0, ttsHint = false;
function silentWav() {
  const n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
function getPlayer() { if (!player) { player = new Audio(); player.setAttribute("playsinline", ""); player.preload = "auto"; } return player; }
function unlockSpeech() {
  // iOS gibt Ton erst nach einer Nutzeraktion frei – einmal still abspielen
  if (unlockSpeech.done) return;
  unlockSpeech.done = true;
  try { const p = getPlayer(); p.src = silentWav(); const r = p.play(); if (r) r.catch(() => {}); } catch {}
  try { if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch {}
}
function stopSpeaking() {
  speakToken++;
  try { if (player) player.pause(); } catch {}
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch {}
}
async function ttsFetch(body) {
  const { data: { session } } = await sb.auth.getSession();
  return fetch(`${SB_URL}/functions/v1/tts`, {
    method: "POST",
    headers: { Authorization: `Bearer ${session?.access_token || ""}`, apikey: SB_KEY, "content-type": "application/json" },
    body: JSON.stringify(body),
  });
}
async function speak(text, force, onDone, agent, voiceId) {
  stopSpeaking();
  const my = speakToken;
  const done = () => { if (my === speakToken && onDone) onDone(); };
  const clean = String(text || "").replace(/\*\*/g, "").replace(/^[-•]\s*/gm, "").replace(/\s+/g, " ").trim();
  if (!clean) return done();
  if (cloudTTS !== false) {
    try {
      const r = await ttsFetch({ text: clean, agent: agent || S.agent, voice: voiceId || undefined });
      if (my !== speakToken) return;
      if (r.status === 501) { cloudTTS = false; }
      else if (!r.ok) { throw new Error((await r.text()).slice(0, 150)); }
      else {
        const blob = await r.blob();
        if (my !== speakToken) return;
        cloudTTS = true;
        const p = getPlayer(), url = URL.createObjectURL(blob);
        p.onended = () => { URL.revokeObjectURL(url); done(); };
        p.onerror = () => done();
        p.src = url;
        await p.play();
        awakeKick();
        return;
      }
    } catch (e) {
      if (my !== speakToken) return;
      console.warn("Stimme:", e);
      if (!ttsHint) { ttsHint = true; toast("Menschliche Stimme gerade nicht erreichbar"); }
    }
  }
  if (cloudTTS === false && !ttsHint) { ttsHint = true; toast("Menschliche Stimme noch nicht eingerichtet – vorerst Gerätestimme"); }
  deviceSpeak(clean, done, my);
}
function deviceSpeak(clean, done, my) {
  if (!window.speechSynthesis) return done();
  const parts = clean.replace(/€/g, " Euro").match(/[^.!?]+[.!?]*/g) || [clean];
  voice = voice || pickVoice();
  parts.forEach((part, i) => {
    const u = new SpeechSynthesisUtterance(part.trim()); u.lang = "de-DE"; if (voice) u.voice = voice;
    if (i === parts.length - 1) { u.onend = () => { if (my === speakToken) done(); }; u.onerror = u.onend; }
    speechSynthesis.speak(u);
  });
}

let busy = false;
function setupCapture() {
  const cap = $("#cap");
  const grow = () => { cap.style.height = "auto"; cap.style.height = Math.min(cap.scrollHeight, 140) + "px"; };
  cap.addEventListener("input", () => { grow(); updateSendBtn(); });
  cap.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  $("#send").onclick = submit;
  $("#vstart").onclick = () => openVoice(S.agent);
  $("#add").onclick = () => openSheet(null);
  $("#menu").onclick = openMenu;
  setupMic();
}

function updateSendBtn() {
  const empty = !$("#cap").value.trim();
  const voice = inChat() && empty && hasSR();
  $("#vstart").classList.toggle("hidden", !voice);
  $("#send").classList.toggle("hidden", voice);
}
function submit() {
  const cap = $("#cap");
  stopListening();                 // Diktat beenden, sonst schreibt es den alten Text zurück
  const text = cap.value.trim();
  if (!text || busy) return;
  if (ls.get("tts", true)) unlockSpeech();
  cap.value = ""; cap.style.height = "auto"; updateSendBtn();
  askAgent(text);
}

async function askAgent(text) {
  if (inChat()) return askPersona(text);
  busy = true; $("#send").disabled = true;
  const r = $("#reply");
  r.classList.remove("hidden");
  r.innerHTML = `<span class="spin"></span>${esc(text)}`;
  try {
    const { data, error } = await sb.functions.invoke("agent", { body: { message: text, history: S.history } });
    if (error || data?.error) throw new Error(data?.error || (await errText(error)));
    S.history.push({ role: "user", content: text }, { role: "assistant", content: data.reply || "" });
    S.history = S.history.slice(-10);
    showReply(data);
    scheduleReload();
  } catch (e) {
    // Nichts geht verloren: Zuruf landet unverändert im Eingang
    await insertTask({ title: text.slice(0, 200), notes: text.length > 200 ? text : null });
    r.innerHTML = `<button class="x" aria-label="Schließen">✕</button>Die KI war nicht erreichbar. Dein Zuruf liegt im Eingang.
      <div class="acts">${esc(e.message || e)}</div>`;
    r.querySelector(".x").onclick = () => r.classList.add("hidden");
  } finally {
    busy = false; $("#send").disabled = false;
  }
}
async function askPersona(text) {
  const agent = S.agent;
  busy = true; $("#send").disabled = true; stopSpeaking(); stopListening();
  S.pending = { agent, text }; render(); scrollChat();
  try {
    const { data, error } = await sb.functions.invoke("agent", { body: { agent, message: text } });
    if (error || data?.error) throw new Error(data?.error || (await errText(error)));
    S.pending = null;
    await loadAgent(agent);
    if (inChat() && S.agent === agent) { render(); scrollChat(); }
    if (data.drafts?.length) showReply({ reply: "Mail-Entwurf zur Freigabe:", actions: [], drafts: data.drafts });
    scheduleReload();
  } catch (e) {
    S.pending = null;
    await loadAgent(agent); render();
    const cap = $("#cap"); if (!cap.value) { cap.value = text; cap.dispatchEvent(new Event("input")); }
    toast("Keine Antwort: " + String(e.message || e).slice(0, 80));
  } finally {
    busy = false; $("#send").disabled = false;
  }
}
async function errText(error) {
  try { const b = await error.context?.json?.(); if (b?.error) return b.error; } catch {}
  return error?.message || "Unbekannter Fehler";
}

function showReply(data) {
  const r = $("#reply");
  const drafts = (data.drafts || []).map((d, i) => `
    <div class="draft" data-i="${i}">

      <div class="btns"><button class="btn primary d-send">In Mail-App öffnen</button><button class="btn d-copy">Text kopieren</button><button class="btn d-drop">Verwerfen</button></div>
    </div>`).join("");
  r.innerHTML = `<button class="x" aria-label="Schließen">✕</button>${esc(data.reply || "Erledigt.")}

const hasSR = () => !!(window.SpeechRecognition || window.webkitSpeechRecognition);
let rec = null;
function stopListening() { if (rec) { try { rec.abort(); } catch {} rec = null; } const m = $("#mic"); if (m) m.classList.remove("rec", "listen"); }

// auto = true: Gesprächsmodus – nach einer Sprechpause wird automatisch gesendet
function startListening(auto) {

  if (!SR || rec || busy) return;
  const cap = $("#cap"), mic = $("#mic");
  const grow = () => { cap.style.height = "auto"; cap.style.height = Math.min(cap.scrollHeight, 140) + "px"; };
  stopSpeaking();
  const r = new SR(); r.lang = "de-DE"; r.interimResults = true; r.continuous = !auto;
  const base = cap.value ? cap.value.trim() + " " : "";
  let heard = "", silence = null;
  r.onresult = (e) => {
    if (rec !== r) return;         // nach dem Senden eintreffende Reste ignorieren
    let txt = "";
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    heard = txt; cap.value = base + txt; grow();
    if (auto) { clearTimeout(silence); silence = setTimeout(() => { try { r.stop(); } catch {} }, 1800); }
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed") toast("Mikrofon nicht erlaubt – in den Einstellungen freigeben.");
    else if (e.error !== "aborted" && e.error !== "no-speech") toast("Diktat: " + e.error);
  };
  r.onend = () => {
    clearTimeout(silence);
    const wasActive = rec === r;
    if (wasActive) rec = null;
    mic.classList.remove("rec", "listen");
    if (wasActive && auto && heard.trim()) submit();
    else if (!auto) cap.focus();
  };
  try { r.start(); rec = r; mic.classList.add(auto ? "listen" : "rec"); }
  catch { rec = null; if (auto) toast("Zum Weitersprechen aufs Mikrofon tippen."); }
}

function setupMic() {
  if (!hasSR()) return; // Fallback: Diktier-Taste der Tastatur
  const mic = $("#mic"); mic.classList.remove("hidden");
  mic.onclick = () => {
    if (rec) { try { rec.stop(); } catch {} return; }
    unlockSpeech();
    startListening(false);
  };
}

boot();
</script>
